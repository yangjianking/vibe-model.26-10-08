<svg viewBox="0 0 680 620" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>数据流图</title>
  <desc>NWP 模型各模块间 State / Tendency / 诊断量 / 观测数据的流动关系</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="60" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="120" y="78" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">State 状态量</text>
    <text x="120" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">ρ ρu ρv ρw ρθ SoA</text>
  </g>

  <g>
    <rect x="270" y="60" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="350" y="78" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Tendency 倾向量</text>
    <text x="350" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">∂ρ ∂ρu ∂ρv ∂ρw ∂ρθ</text>
  </g>

  <g>
    <rect x="500" y="60" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="570" y="78" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">求解器 solver</text>
    <text x="570" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">BiCGStab / Helmholtz</text>
  </g>

  <g>
    <rect x="40" y="250" width="160" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="120" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#633806">网格度量 metric</text>
    <text x="120" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">√G g11 g12 g22 协变基</text>
  </g>

  <g>
    <rect x="270" y="250" width="160" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
    <text x="350" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#72243E">物理强迫 physics</text>
    <text x="350" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993556">加热 / 摩擦 / 扩散项</text>
  </g>

  <g>
    <rect x="500" y="250" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="570" y="268" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">诊断量 diagnostics</text>
    <text x="570" y="286" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">质量 / 能量 / 角动量</text>
  </g>

  <g>
    <rect x="40" y="440" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="120" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">观测算子 H</text>
    <text x="120" y="476" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">4D-Var 前向映射</text>
  </g>

  <g>
    <rect x="270" y="440" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="350" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">I/O 输入输出</text>
    <text x="350" y="476" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">NetCDF / restart / 观测读取</text>
  </g>

  <g>
    <rect x="500" y="440" width="140" height="56" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
    <text x="570" y="458" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#72243E">伴随模型 ADM</text>
    <text x="570" y="476" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993556">梯度 ∂J/∂x 反传</text>
  </g>

  <line x1="200" y1="88" x2="270" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="235" y="78" text-anchor="middle" font-size="11" fill="#5F5E5A">读取</text>
  <line x1="430" y1="88" x2="500" y2="88" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="465" y="78" text-anchor="middle" font-size="11" fill="#5F5E5A">RHS</text>
  <line x1="570" y1="116" x2="570" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="160" x2="570" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="500" y1="140" x2="570" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="535" y="132" text-anchor="middle" font-size="11" fill="#5F5E5A">δπ'</text>

  <line x1="120" y1="116" x2="120" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="160" x2="120" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="140" x2="200" y2="140" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="160" y="132" text-anchor="middle" font-size="11" fill="#5F5E5A">度量因子</text>

  <line x1="200" y1="278" x2="270" y2="278" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="278" x2="500" y2="278" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="350" y1="116" x2="350" y2="250" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="362" y="180" text-anchor="start" font-size="11" fill="#5F5E5A">累积倾向</text>

  <line x1="120" y1="306" x2="120" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="306" x2="350" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="306" x2="570" y2="330" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="120" y1="350" x2="120" y2="440" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="350" x2="570" y2="440" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="350" x2="350" y2="440" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="200" y1="468" x2="270" y2="468" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="430" y1="468" x2="500" y2="468" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="120" y1="496" x2="120" y2="520" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="540" x2="120" y2="520" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="120" y1="520" x2="570" y2="520" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="345" y="512" text-anchor="middle" font-size="11" fill="#5F5E5A">残差/梯度</text>
</svg>
