<svg viewBox="0 0 680 660" width="100%" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>单个时间步时序图</title>
  <desc>积分器在一次时间步内调用动力学核、Helmholtz 求解器、物理参数化的交互时序</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="60" y="40" width="120" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
    <text x="120" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0C447C">积分器 integrator</text>
  </g>
  <g>
    <rect x="230" y="40" width="120" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="290" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">动力学核 dynamics</text>
  </g>
  <g>
    <rect x="400" y="40" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="465" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Helmholtz 求解器</text>
  </g>
  <g>
    <rect x="570" y="40" width="90" height="44" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
    <text x="615" y="62" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#72243E">physics</text>
  </g>

  <line x1="120" y1="84" x2="120" y2="620" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="290" y1="84" x2="290" y2="620" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="465" y1="84" x2="465" y2="620" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
  <line x1="615" y1="84" x2="615" y2="620" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>

  <line x1="120" y1="110" x2="290" y2="110" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="100" text-anchor="middle" font-size="11" fill="#5F5E5A">compute_rhs(state)</text>

  <line x1="290" y1="135" x2="465" y2="135" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="377" y="125" text-anchor="middle" font-size="11" fill="#5F5E5A">solve(δπ')</text>

  <line x1="465" y1="160" x2="290" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="377" y="150" text-anchor="middle" font-size="11" fill="#5F5E5A">δπ' 压力增量</text>

  <line x1="290" y1="185" x2="120" y2="185" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="175" text-anchor="middle" font-size="11" fill="#5F5E5A">tendency 倾向量</text>

  <line x1="120" y1="215" x2="290" y2="215" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="205" text-anchor="middle" font-size="11" fill="#5F5E5A">advect(flux 两阶段配对)</text>

  <line x1="290" y1="240" x2="120" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="230" text-anchor="middle" font-size="11" fill="#5F5E5A">平流倾向</text>

  <line x1="120" y1="270" x2="615" y2="270" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="260" text-anchor="middle" font-size="11" fill="#5F5E5A">apply_physics(state, dt)</text>

  <line x1="615" y1="295" x2="120" y2="295" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="285" text-anchor="middle" font-size="11" fill="#5F5E5A">物理倾向增量</text>

  <line x1="120" y1="330" x2="120" y2="360" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="132" y="345" text-anchor="start" font-size="11" fill="#5F5E5A">RK3 子步 1/2/3 迭代</text>

  <line x1="120" y1="390" x2="290" y2="390" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="380" text-anchor="middle" font-size="11" fill="#5F5E5A">diagnose(state)</text>

  <line x1="290" y1="415" x2="120" y2="415" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="405" text-anchor="middle" font-size="11" fill="#5F5E5A">质量/能量/角动量</text>

  <line x1="120" y1="450" x2="120" y2="480" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="132" y="465" text-anchor="start" font-size="11" fill="#5F5E5A">更新状态 state^{n+1}</text>

  <line x1="120" y1="510" x2="290" y2="510" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="500" text-anchor="middle" font-size="11" fill="#5F5E5A">输出 / restart 检查点</text>

  <line x1="290" y1="535" x2="120" y2="535" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="205" y="525" text-anchor="middle" font-size="11" fill="#5F5E5A">写 NetCDF</text>

  <line x1="120" y1="570" x2="120" y2="600" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="132" y="585" text-anchor="start" font-size="11" fill="#5F5E5A">下一个时间步 t+Δt</text>
</svg>
